<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prague Run Clubs</title>
  <meta name="description" content="Every run club in Prague on one map. See who runs today, find a run by day, pace and distance, and add it to your calendar.">
  <meta property="og:title" content="Prague Run Clubs">
  <meta property="og:description" content="Every run club in Prague on one map. See who runs today and find a run that fits.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://praguerunclubs.vercel.app/">
  <meta property="og:image" content="https://praguerunclubs.vercel.app/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0A1120">
  <meta name="color-scheme" content="dark light">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <!-- crossorigin lets the manifest load on password-protected Vercel preview deployments too -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Run Clubs">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">

  <!-- Set the theme before first paint so there is no flash -->
  <script>
    (function () {
      var pref = 'auto';
      try { pref = (JSON.parse(localStorage.getItem('prc_prefs_v1') || '{}').theme) || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && !window.matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>

<div id="map" class="map"></div>

<header class="top">
  <h1 class="brand">Prague Run Clubs</h1>
  <div class="top-actions">
    <button type="button" class="ibtn" id="btnLocate" aria-pressed="false" aria-label="Show my location and distances"></button>
    <button type="button" class="ibtn" id="btnAbout" aria-haspopup="dialog" aria-label="Settings and info"></button>
  </div>
</header>

<main class="sheet" id="sheet" data-snap="half">
  <div class="sheet-head" id="sheetHead">
    <button type="button" class="grab" id="grab" aria-label="Expand or collapse the run list"><span></span></button>
    <button type="button" class="next" id="next"></button>
    <div class="bar">
      <div class="tabs" role="tablist" aria-label="Views">
        <button type="button" role="tab" id="tabDay" data-view="day" aria-selected="true" aria-controls="viewDay">Day</button>
        <button type="button" role="tab" id="tabWeek" data-view="week" aria-selected="false" aria-controls="viewWeek" tabindex="-1">Week</button>
        <button type="button" role="tab" id="tabClubs" data-view="clubs" aria-selected="false" aria-controls="viewClubs" tabindex="-1">Clubs</button>
      </div>
      <button type="button" class="find" id="btnFind" aria-haspopup="dialog"></button>
    </div>
  </div>

  <div class="scroll scrollable" id="scroll">
    <div class="status" id="status" role="status" hidden></div>
    <div class="chips" id="chips" hidden></div>

    <section class="view" id="viewDay" role="tabpanel" aria-labelledby="tabDay">
      <div class="days" id="days" role="group" aria-label="Pick a day"></div>
      <p class="day-meta" id="dayMeta"></p>
      <div class="list" id="dayList"></div>
    </section>

    <section class="view" id="viewWeek" role="tabpanel" aria-labelledby="tabWeek" hidden>
      <div class="lanes" id="lanes"></div>
      <p class="week-note" id="weekNote"></p>
    </section>

    <section class="view" id="viewClubs" role="tabpanel" aria-labelledby="tabClubs" hidden>
      <label class="search">
        <span class="sr-only">Search clubs</span>
        <input type="search" id="search" placeholder="Search clubs or places" autocomplete="off" enterkeyhint="search">
      </label>
      <div class="list" id="clubList"></div>
      <p class="submit">Know a club that's missing?
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSfpEdjcw68S7oPwbujrpC8uM0B4XPpq-_ZxtWMCa6fuS98msg/viewform?usp=publish-editor" target="_blank" rel="noopener">Submit a club</a>
      </p>
    </section>
  </div>

  <section class="pane" id="detail" aria-labelledby="dName" hidden></section>
  <section class="pane" id="finder" aria-labelledby="finderTitle" hidden></section>
  <span class="safe-probe" id="safeProbe" aria-hidden="true"></span>
</main>

<dialog class="about" id="about" aria-labelledby="aboutTitle">
  <div class="about-in">
    <div class="about-head">
      <h2 id="aboutTitle">Prague Run Clubs</h2>
      <button type="button" class="ibtn flat" id="aboutClose" aria-label="Close"></button>
    </div>
    <p class="about-stats" id="aboutStats"></p>
    <p class="about-data"><span id="aboutData"></span> <button type="button" class="link" id="btnRefresh">Refresh</button></p>

    <h3 id="themeLbl">Appearance</h3>
    <div class="seg" id="themeSeg" role="group" aria-labelledby="themeLbl">
      <button type="button" data-theme-pref="auto" aria-pressed="true">Auto</button>
      <button type="button" data-theme-pref="light" aria-pressed="false">Light</button>
      <button type="button" data-theme-pref="dark" aria-pressed="false">Dark</button>
    </div>

    <div class="about-links">
      <a class="btn" href="https://docs.google.com/forms/d/e/1FAIpQLSfpEdjcw68S7oPwbujrpC8uM0B4XPpq-_ZxtWMCa6fuS98msg/viewform?usp=publish-editor" target="_blank" rel="noopener">Submit a club</a>
      <button type="button" class="btn" id="btnInstallAbout" hidden>Install the app</button>
    </div>
    <p class="about-ios" id="aboutIos" hidden></p>

    <p class="credits">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors, tiles by <a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> and <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a>. Forecast by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>.</p>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="install" id="installBanner" role="dialog" aria-label="Install Prague Run Clubs" hidden>
  <img src="/icon-192.png" alt="" width="40" height="40">
  <div class="install-text" id="installText"><strong>Get the app</strong>Add Prague Run Clubs to your home screen.</div>
  <button type="button" class="btn primary" id="installBtn" hidden>Install</button>
  <button type="button" class="ibtn flat" id="installClose" aria-label="Dismiss"></button>
</div>

<noscript><p class="noscript">Prague Run Clubs needs JavaScript to show the map and the run list.</p></noscript>

<script src="/app.js" defer></script>
</body>
</html>
